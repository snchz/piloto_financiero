    <!-- Config Modal -->
    <dialog id="configModal" class="border-0 p-0 rounded-4 shadow-lg" style="max-width: 500px; width: 95%;">
        <div class="glass-panel p-4" style="background: rgba(17, 20, 30, 0.95);">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0 fs-6 fw-bold text-white">⚙️ Configuración del Sistema</h5>
                <button type="button" class="btn-close btn-close-white" onclick="document.getElementById('configModal').close()"></button>
            </div>
            <form id="config-form" class="row g-3">
                <div class="col-12">
                    <label class="form-label text-secondary small mb-1">Nombre de la Aplicación</label>
                    <input type="text" id="cfg-app-title" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary small mb-1">Telegram Bot Token</label>
                    <input type="password" id="cfg-telegram-token" class="form-control" placeholder="Opcional">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary small mb-1">Telegram Chat ID</label>
                    <input type="text" id="cfg-telegram-chat-id" class="form-control" placeholder="Opcional">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary small mb-1">Intervalo Refresco (s)</label>
                    <input type="number" id="cfg-refresh-interval" class="form-control" min="10" value="30">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-secondary small mb-1">TTL Caché Divisas (h)</label>
                    <input type="number" id="cfg-exchange-rate-ttl" class="form-control" min="1" value="12">
                </div>
                <div class="col-12">
                    <label class="form-label text-secondary small mb-1">Retención Actividad (Días)</label>
                    <input type="number" id="cfg-activity-retention" class="form-control" min="1" value="2">
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="cfg-check-market-hours">
                        <label class="form-check-label text-white small" for="cfg-check-market-hours">Solo actualizar durante horas de mercado</label>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="cfg-debug-ui">
                        <label class="form-check-label text-white small" for="cfg-debug-ui">Mostrar botón de depuración (Logs)</label>
                    </div>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Guardar Configuración</button>
                </div>
            </form>
        </div>
    </dialog>
