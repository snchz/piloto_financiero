    <!-- Edit Modal -->
    <dialog id="editModal" class="border-0 p-0 rounded-4 shadow-lg" style="max-width: 420px; width: 95%;">
        <div class="glass-panel p-4" style="background: rgba(17, 20, 30, 0.95);">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0 fs-6 fw-bold text-white">✏️ Editar Alerta</h5>
                <button type="button" class="btn-close btn-close-white" onclick="document.getElementById('editModal').close()"></button>
            </div>
            <form id="edit-form" class="row g-3">
                <div class="col-12">
                    <label class="form-label text-secondary small mb-1">Precio Objetivo</label>
                    <input type="number" step="any" id="edit-target" name="target" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label text-secondary small mb-1">Alerta Variación Diaria (%)</label>
                    <input type="number" step="any" id="edit-target-pct" name="target_pct" class="form-control">
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </dialog>
