    <button class="action-btn debug-toggle shadow" onclick="toggleDebug()" title="Logs de depuración">🐞</button>
    <div id="debugPanel" class="debug-panel shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-secondary border-opacity-25">
            <span class="fw-bold text-white">📋 System Debug Logs</span>
            <div>
                <button class="btn btn-sm btn-outline-secondary py-0 px-2 font-monospace" onclick="copyLogs()" style="font-size:0.75rem;">Copiar</button>

                <button class="btn-close btn-close-white ms-2" onclick="toggleDebug()"></button>
            </div>
        </div>
        <div id="debugLogs" class="debug-logs overflow-auto pe-1"></div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>
