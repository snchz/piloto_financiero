<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1b"/>
      <stop offset="50%" stop-color="#11162b"/>
      <stop offset="100%" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="pilotGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="18" y="18" width="476" height="476" rx="104" ry="104" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="104" ry="104" fill="none" stroke="url(#borderGrad)" stroke-width="7"/>

  <!-- Subtle Chart Grid Lines -->
  <line x1="70" y1="390" x2="442" y2="390" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="70" y1="300" x2="442" y2="300" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="70" y1="210" x2="442" y2="210" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="70" y1="120" x2="442" y2="120" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- Background Financial Bars -->
  <rect x="100" y="290" width="44" height="100" rx="8" fill="url(#bar1Grad)"/>
  <rect x="175" y="220" width="44" height="170" rx="8" fill="url(#bar2Grad)"/>
  <rect x="250" y="160" width="44" height="230" rx="8" fill="url(#bar3Grad)"/>

  <!-- Area under Curve -->
  <path d="M 80 390 L 80 345 C 140 335, 175 285, 235 250 C 295 215, 340 160, 400 115 L 400 390 Z" fill="url(#areaGrad)"/>

  <!-- Upward Trend Line (Glowing) -->
  <path d="M 80 345 C 140 335, 175 285, 235 250 C 295 215, 340 160, 400 115" fill="none" stroke="url(#lineGrad)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Data Nodes -->
  <circle cx="122" cy="338" r="7" fill="#6366f1" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="197" cy="275" r="7" fill="#818cf8" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="272" cy="225" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  <circle cx="345" cy="160" r="8" fill="#34d399" stroke="#ffffff" stroke-width="3"/>

  <!-- Navigator Pilot Arrow (At Apex) -->
  <g transform="translate(400, 112) rotate(-35)" filter="url(#softGlow)">
    <path d="M 0 -24 L 18 20 L 0 11 L -18 20 Z" fill="url(#pilotGrad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Sparkle Accent at Apex -->
  <path d="M 445 88 Q 445 100 457 100 Q 445 100 445 112 Q 445 100 433 100 Q 445 100 445 88 Z" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
</svg>